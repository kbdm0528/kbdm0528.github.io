const weekMax=hasWeeks?d3.max(D.clusters,c=>c.weekly?d3.max(c.weekly):0):0;
const weekTotal=i=>D.clusters.reduce((a,c)=>a+(c.weekly?c.weekly[i]:0),0);
const curTotal=()=>facetOn()?D.clusters.reduce((a,c)=>a+vAt(c),0):(wk==null?total:weekTotal(wk));

// rail
const list=d3.select('#list');
const rowHtml=c=>{
 // per-keyword values follow the current view (month / week / facet filter)
 const ns=(nodesByC[c.id]||[]).filter(n=>!facetOn()||nodeOk(n));
 const withV=ns.filter(n=>wk==null||n.weekly).map(n=>[n.kw,nodeVal(n)]).sort((a,b)=>b[1]-a[1]);
 const noV=ns.filter(n=>wk!=null&&!n.weekly).map(n=>n.kw);
 const top=hasVol?withV.slice(0,8):[], rest=hasVol?withV.slice(8).map(x=>x[0]).concat(noV):c.keywords, kmax=Math.max(1,...top.map(x=>x[1]));
 const kv=k=>{const f=top.find(x=>x[0]===k);return f?f[1]:0};
 const noData=wk!=null&&!c.weekly;
 return `<div class="l"><span>${c.label}</span>${hasTrend&&c.weekly?spark(c.weekly,col(c),44,12):''}<span class="n">${noData?'월만':(facetOn()&&vAt(c)===0?'해당 없음':fmt(vAt(c)))}</span></div>
 <div class="bar"><i style="width:${100*vAt(c)/Math.max(1,vAt(big[0]),...big.map(vAt))}%;background:${col(c)}"></i></div>
 <div class="need">${c.need||''}${c.intent?`<em>${c.intent}</em>`:''}</div>
 ${top.length?`<div class="top">${top.map(([k,v])=>`<div><span>${k}</span><em>${fmt(v)}</em><i><b style="width:${100*v/kmax}%;background:${col(c)}"></b></i></div>`).join('')}</div>`:''}
 ${rest.length?`<div class="kws">${top.length?`<div class="more">나머지 ${rest.length}개${noV.length&&wk!=null?` (주간 값 없는 ${noV.length}개 포함)`:''}</div>`:''}${hasVol?withV.slice(8).map(([k,v])=>`<span>${k} <em>${fmt(v)}</em></span>`).join('')+noV.map(k=>`<span>${k}</span>`).join(''):rest.map(k=>`<span>${k}</span>`).join('')}</div>`:''}`};
let grp,rows;
function buildRail(){
 list.selectAll('*').remove();
 const sections=byGroup?groups.map(g=>({g,cs:big.filter(c=>c.group===g.id).sort((a,b)=>vAt(b)-vAt(a))})):[{g:null,cs:big.slice().sort((a,b)=>vAt(b)-vAt(a))}];
 if(byGroup) sections.sort((a,b)=>gAt(b.g)-gAt(a.g));
 const tot=curTotal();
 grp=list.selectAll('div.grp').data(sections).join('div').attr('class','grp');
 grp.filter(s=>s.g).append('button').attr('class','ghead').attr('id',s=>'g'+s.g.id)
  .html(s=>`<div class="t"><i style="background:${gcol(s.g.id)}"></i><span>${s.g.name}</span><span class="n">${fmt(gAt(s.g))}</span></div>
   <div class="who">${s.g.who||''}</div>${s.g.story?`<div class="story">${s.g.story}</div>`:''}
   <div class="share"><b style="width:${100*gAt(s.g)/Math.max(1,tot)}%;background:${gcol(s.g.id)}"></b></div>
   ${hasTrend&&s.g.weekly?`<div class="trend">${spark(s.g.weekly,gcol(s.g.id),80,18)}<span>${weeks.length}주 추이</span>${chgHtml(s.g.weekly)}</div>`:''}`)
  .on('click',(e,s)=>{selC=null;const was=openG.has(s.g.id);was?openG.delete(s.g.id):openG.add(s.g.id);selG=was?null:s.g.id;paint()});
 rows=grp.selectAll('button.row').data(s=>s.cs).join('button').attr('class','row').attr('id',c=>'r'+c.id).html(rowHtml)
  .on('click',(e,c)=>{selG=null;selC=selC===c.id?null:c.id;paint()});
 list.append('div').attr('class','rest').text(wk==null?`검색어 2개 이하인 작은 군집 ${small.length}개는 지도에 회색 점으로만 표시합니다.`:`주간 값은 상위 ${D.trend_top||200}개 검색어만 배분한 추정치입니다. "월만"은 이 주의 값이 없는 군집입니다.`);
 paint();
}

// legend as filters
const legendData=byGroup?groups.map(g=>({key:g.id,name:g.name,n:hasVol?Math.round(100*g.volume/total)+'%':g.size,color:gcol(g.id)}))
 :Object.keys(INT).map(k=>({key:k,name:k,n:big.filter(c=>c.intent===k).length,color:css(INT[k])})).filter(x=>x.n);
const keyOf=c=>byGroup?c.group:c.intent;
const SHOW_LEGEND=false; // 집단 범례 (왼쪽 목록이 같은 역할)
const legend=d3.select('#legend').selectAll('button').data(SHOW_LEGEND?legendData:[]).join('button')
 .html(x=>`<i style="background:${x.color}"></i>${x.name}<em>${x.n}</em>`)
 .on('click',(e,x)=>{off.has(x.key)?off.delete(x.key):off.add(x.key);legend.classed('off',x=>off.has(x.key));paint()});

// facet chips (시장 / 유형)
if(hasFacet){
 const fc=d3.select('#facets');
 const mk=(label,list,set)=>{fc.append('span').attr('class','k').text(label);
  const bs=fc.selectAll(null).data(list).join('button').text(x=>x).on('click',(e,x)=>{set.has(x)?set.delete(x):set.add(x);bs.classed('off',y=>set.has(y));applyWeek()});};
 mk('시장',MK,offM); fc.append('span').attr('class','sep'); mk('유형',TP,offT);
}
// week control
if(hasWeeks){
 const wc=d3.select('#weeks');
 const items=[{i:null,t:'최근 한 달',d:''},...weeks.map((w,i)=>({i,...wlabel(w)}))];
 wc.selectAll('button').data(items).join('button').classed('on',x=>x.i===wk)
  .html(x=>`${x.t}<small>${x.d}</small>`)
  .on('click',(e,x)=>{wk=x.i;wc.selectAll('button').classed('on',y=>y.i===wk);applyWeek()});
}

// map
const svg=d3.select('#g');const VW=svg.node().clientWidth,VH=svg.node().clientHeight;
const g=svg.append('g');svg.call(d3.zoom().scaleExtent([.4,4]).on('zoom',e=>g.attr('transform',e.transform)));
const rMonth=d3.scaleSqrt().domain([0,d3.max(D.clusters,val)]).range([3,Math.min(78,VW/7)]).clamp(true);
const rWeek=d3.scaleSqrt().domain([0,weekMax||1]).range([3,Math.min(78,VW/7)]).clamp(true);
const radius=c=>Math.max(3,wk==null?rMonth(vAt(c)):rWeek(vAt(c)));
const M=Math.min(70,VW/8),TOP=document.getElementById('topbar').offsetHeight+28,BOT=hasWeeks?document.getElementById('weeks').offsetHeight+36:44;
const nodes=D.clusters.map(c=>({...c,r:radius(c),x:M+c.x*(VW-2*M),y:TOP+c.y*(VH-TOP-BOT)}));
const links=(D.cluster_links||[]).filter(([s,t,w])=>w>=0.7&&byId.get(s).size>=3&&byId.get(t).size>=3).map(([s,t,w])=>({source:s,target:t,w}));
const link=g.append('g').selectAll('line').data(links).join('line');
const isl=g.append('g').selectAll('g').data(nodes).join('g').attr('class','isl')
 .on('click',(e,n)=>{if(n.size<3)return;selG=null;selC=selC===n.id?null:n.id;paint();if(selC!=null)document.getElementById('r'+selC).scrollIntoView({block:'nearest'})})
 .on('mousemove',(e,n)=>{const t=document.getElementById('tip');t.style.display='block';t.style.left=(e.offsetX+14)+'px';t.style.top=(e.offsetY+14)+'px';
   const v=vAt(n),tot=curTotal();
   t.textContent=n.size>=3?(hasVol?`${n.label}: ${wk==null?'월':wlabel(weeks[wk]).t} ${n.weekly||wk==null?fmt(v)+'회':'주간 값 없음'}${v?`, 전체의 ${(100*v/tot).toFixed(1)}%`:''}, 검색어 ${n.size}개${hasTrend&&change(n.weekly)!=null?`, 최근 4주 ${change(n.weekly)>0?'+':''}${change(n.weekly)}%`:''}`:`${n.label}: 검색어 ${n.size}개`):n.keywords.join(', ')})
 .on('mouseleave',()=>document.getElementById('tip').style.display='none');
isl.append('circle').attr('r',n=>n.r).attr('fill',n=>col(n)).attr('stroke',n=>n.size>=3?col(n):'none');
isl.filter(n=>n.size>=3&&n.r>=14).each(function(n){
 const maxc=Math.max(4,Math.floor(n.r/6)),maxl=n.r>=30?3:2,fs=n.r>=30?12:11,lh=fs+3;
 const words=n.label.split(' '),lines=[];let cur='';
 words.forEach(w=>{if((cur+' '+w).trim().length>maxc&&cur){lines.push(cur);cur=w}else cur=(cur+' '+w).trim()});lines.push(cur);
 const outside=()=>{if(n.r>=22){n.out=true;d3.select(this).append('text').attr('class','out').attr('font-size',11).attr('y',n.r+13).text(n.label)}};
 if(lines.length>maxl)return outside();
 const t=d3.select(this).append('text').attr('font-size',fs).attr('y',-(lines.length-1)*lh/2);
 lines.forEach((l,i)=>t.append('tspan').attr('x',0).attr('dy',i?lh:'.35em').text(l));
 const b=t.node().getBBox(); n.lw=b.width; n.lh=lines.length*lh;
 if(b.width>n.r*1.9||lines.length*lh>n.r*1.8){t.remove();outside()}
});
const sim=d3.forceSimulation(nodes).force('link',d3.forceLink(links).id(n=>n.id).distance(l=>140-l.w*100).strength(l=>l.w*.4))
 .force('charge',d3.forceManyBody().strength(n=>-n.r*2)).force('x',d3.forceX(n=>n.x).strength(.12)).force('y',d3.forceY(n=>n.y).strength(.12)).force('center',d3.forceCenter(VW/2,(VH-BOT+TOP)/2).strength(.4))
 .force('collide',d3.forceCollide(n=>n.r+(n.out?16:6)))
 .force('group',byGroup?alpha=>{const cen={};nodes.forEach(n=>{if(n.group==null)return;const c=cen[n.group]=cen[n.group]||{x:0,y:0,k:0};c.x+=n.x;c.y+=n.y;c.k++});
   nodes.forEach(n=>{const c=cen[n.group];if(!c)return;n.vx+=(c.x/c.k-n.x)*alpha*.35;n.vy+=(c.y/c.k-n.y)*alpha*.35})}:null).stop();
for(let i=0;i<300;i++){sim.tick();nodes.forEach(n=>{n.x=Math.max(n.r+12,Math.min(VW-n.r-12,n.x));n.y=Math.max(n.r+TOP,Math.min(VH-n.r-BOT,n.y))})}
link.attr('x1',l=>l.source.x).attr('y1',l=>l.source.y).attr('x2',l=>l.target.x).attr('y2',l=>l.target.y);
isl.attr('transform',n=>`translate(${n.x},${n.y})`);

function applyWeek(){
 nodes.forEach(n=>n.r=radius(n));
 const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
 const cs=isl.select('circle'); (reduce?cs:cs.transition().duration(350)).attr('r',n=>n.r);
 isl.classed('nodata',n=>n.size>=3&&((wk!=null&&!n.weekly)||(facetOn()&&vAt(n)===0)));
 // labels: keep whatever fits inside; in week/facet view also force the top 10 islands to show a label below
 const TOPN=10, ranked=new Set(nodes.filter(n=>n.size>=3).sort((a,b)=>vAt(b)-vAt(a)).slice(0,TOPN).map(n=>n.id));
 isl.each(function(n){if(n.size<3)return;const g=d3.select(this);const inside=g.select('text:not(.out)');let out=g.select('text.out');
  const fits=inside.size()&&n.lw&&n.lw<=n.r*1.9&&n.lh<=n.r*1.8;
  if(fits){inside.style('display',null);out.style('display','none');return}
  inside.style('display','none');
  const want=(wk==null&&!facetOn())?n.r>=22:(ranked.has(n.id)||n.r>=22);
  if(want){if(!out.size())out=g.append('text').attr('class','out').attr('font-size',11).text(n.label);out.attr('y',n.r+13).style('display',null)}
  else if(out.size())out.style('display','none')});
 const hint=document.getElementById('hint');
 const base=wk==null?`섬을 누르면 검색어가 펼쳐집니다. 크기는 ${hasVol?'월 검색량':'검색어 수'}, 색은 ${byGroup?'수요 집단':'검색 의도'}입니다.`
  :`${wlabel(weeks[wk]).t} (${wlabel(weeks[wk]).d}) 추정 ${fmt(weekTotal(wk))}회. 크기는 이 주의 검색량이며 주끼리 비교됩니다.`;
 hint.textContent=facetOn()?`선택한 시장·유형만 ${fmt(curTotal())}회 (${wk==null?'월':wlabel(weeks[wk]).t}, 전체의 ${(100*curTotal()/(wk==null?total:weekTotal(wk))).toFixed(0)}%). 섬 크기는 조건에 맞는 검색어 합입니다.`:base;
 buildRail();
}
function paint(){
 const vis=n=>!off.has(keyOf(n));
 isl.classed('dim',n=>!vis(n)||(selC!=null&&n.id!==selC)||(selG!=null&&n.group!==selG)).classed('on',n=>n.id===selC);
 link.classed('on',l=>selC!=null&&(l.source.id===selC||l.target.id===selC));
 rows.classed('on',c=>c.id===selC).style('display',c=>vis(c)?null:'none');
 if(selC!=null){const gid=byId.get(selC).group;if(gid!=null)openG.add(gid)}
 grp.classed('on',s=>s.g&&s.g.id===selG).classed('open',s=>!s.g||openG.has(s.g.id)).style('display',s=>s.g&&off.has(s.g.id)?'none':null);
 if(selG!=null)document.getElementById('g'+selG).scrollIntoView({block:'nearest'});
}
document.getElementById('hint').textContent=`섬을 누르면 검색어가 펼쳐집니다. 크기는 ${hasVol?'월 검색량':'검색어 수'}, 색은 ${byGroup?'수요 집단':'검색 의도'}입니다.`;
buildNote();buildRail();
</script></body></html>
